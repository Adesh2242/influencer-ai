<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5219d4" />
    <meta
      name="description"
      content="InfluencerAI matches Indian brands with the right creators: describe your campaign and get a ranked, explainable shortlist across 12 languages, every city tier and your budget."
    />
    <title>InfluencerAI: AI creator matching for Indian brands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static copies of the React forms so Netlify Forms can detect them at deploy time.
      Field names must match src/config/forms.ts.
    -->
    <form name="brand-early-access" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <input type="text" name="monthlyBudget" />
      <textarea name="message"></textarea>
    </form>
    <form name="creator-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="handle" />
      <input type="text" name="platform" />
      <input type="text" name="followers" />
      <input type="text" name="city" />
      <input type="text" name="language" />
      <input type="text" name="niche" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
